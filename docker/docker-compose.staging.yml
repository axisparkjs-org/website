# Staging environment: runs the last image published by the CD (tag `latest`).
#
#   docker compose -f docker/docker-compose.staging.yml up -d
#
# Variables (optional):
#   WEBSITE_IMAGE  image to run (default: ghcr.io/axisparkjs-org/axisparkjs-website:latest)
#   WEBSITE_PORT   port of the host where the site is published (default: 8080)
#
# If the package is private, run `docker login ghcr.io` first with a token that has `read:packages`.
name: axisparkjs-website-staging

services:
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/axisparkjs-org/axisparkjs-website:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-8080}:80"
