server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Docusaurus generates `path/index.html` and links to `path`: serve it without redirecting.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Assets have a hash in their name, they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
