name: CD

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Type of deployment"
        required: true
        type: choice
        options:
          - staging
          - pages
        default: staging
  # Sent by the axispark repository (CD workflow) when a new version is released: the guides and the API
  # reference are saved as the documentation version of the release and the site is deployed to GitHub
  # Pages.
  # client_payload: `ref` (release commit of axispark) and `version` (released version, e.g. 1.5.0).
  # Sent by the benchmarks repository when the results of a release are saved: the site is regenerated and deployed to
  # GitHub Pages from the latest release, without a new documentation version.
  # client_payload: `version` (measured version).
  repository_dispatch:
    types: [axispark-release, benchmarks-updated]
  # Called by the CI workflow after every verified push to `main`: the API reference is generated from
  # axispark `main` and the site is published as the `latest` staging image.
  workflow_call:

concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'pages' || github.event.inputs.group || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/website

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      # The release commits the new documentation version to `main`.
      contents: write
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7

      # `ref` is the release commit of axispark sent in the event, the latest release for `benchmarks-updated`
      # (the deployed site keeps documenting it), or `main` when called by the CI.
      - name: Resolve the axispark commit
        id: axispark
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.client_payload.ref }}
        run: |
          if [ -z "$REF" ] && [ "${{ github.event.action }}" = "benchmarks-updated" ]; then
            REF=$(gh api repos/axisparkjs-org/axispark/releases/latest --jq .tag_name)
          fi
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout axispark
        uses: actions/checkout@v7
        with:
          repository: axisparkjs-org/axispark
          ref: ${{ steps.axispark.outputs.ref }}
          path: axispark

      # The benchmarks pages are generated from the results of the benchmarks repository. Without it, the pages say that
      # there are no results: the documentation is deployed anyway.
      - name: Checkout benchmarks
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: axisparkjs-org/benchmark
          ref: main
          path: benchmarks

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api-generator/package-lock.json
            axispark/package-lock.json

      # The API reference is generated from the built packages.
      - name: Install and build axispark
        working-directory: axispark
        run: |
          npm ci
          npm run build

      - name: Install documentation dependencies
        run: npm ci

      - name: Install API generator dependencies
        run: npm run api:ci

      - name: Generate API documentation
        run: npm run api:generate

      # Release: the current guides (docs/) and the API reference just generated (api/) become the
      # documentation version <major>.<minor> of the release (see scripts/snapshot-version.mjs) and are
      # committed to `main`, so the next builds keep them.
      - name: Save documentation version
        if: github.event.action == 'axispark-release'
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::warning title=No version::The release event has no client_payload.version, the documentation version is not saved."
            exit 0
          fi

          node scripts/snapshot-version.mjs "$VERSION"

          git add versions.json versioned_docs versioned_sidebars api_versions.json api_versioned_docs api_versioned_sidebars
          if git diff --cached --quiet; then
            echo "No documentation version to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: save the documentation of AxiSpark.js ${VERSION}"
          git push

      - name: Generate benchmarks
        run: npm run benchmarks:generate

      - name: Generate changelog
        run: npm run changelog:generate

      - name: Build documentation
        run: npm run build

      # Release: artifact for GitHub Pages.
      - name: Setup Pages
        if: github.event_name == 'repository_dispatch' || github.event.inputs.group == 'pages'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name == 'repository_dispatch' || github.event.inputs.group == 'pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      # Called by the CI: artifact for the staging image.
      - name: Upload site
        if: github.event_name != 'repository_dispatch' && github.event.inputs.group == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: website-build
          path: build
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'repository_dispatch' || github.event.inputs.group == 'pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  staging:
    name: Publish staging image
    needs: build
    if: github.event_name != 'repository_dispatch' && github.event.inputs.group == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: website-build
          path: build

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must be public so staging can pull it without credentials. GitHub creates packages as
      # private and the GITHUB_TOKEN cannot change it: it is done once in the package settings.
      - name: Check that the image is public
        run: |
          REPO="${IMAGE#ghcr.io/}"
          REPO="${REPO,,}"
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token // empty' || true)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${REPO}/manifests/latest")

          if [ "$CODE" = "200" ]; then
            echo "ghcr.io/${REPO}:latest is public"
          else
            echo "::warning title=Private image::ghcr.io/${REPO} cannot be pulled anonymously (HTTP ${CODE}). Make it public once in https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/${REPO#*/} > Package settings > Change visibility > Public."
          fi
