name: CD

on:
  # Sent by the axispark repository (CD workflow) when a new version is released.
  repository_dispatch:
    types: [axispark-release]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7

      # `ref` is the release commit of axispark sent in the event.
      - name: Checkout axispark
        uses: actions/checkout@v7
        with:
          repository: axisparkjs/axispark
          ref: ${{ github.event.client_payload.ref }}
          path: axispark

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api-generator/package-lock.json
            axispark/package-lock.json

      # The API reference is generated from the built packages.
      - name: Install and build axispark
        working-directory: axispark
        run: |
          npm ci
          npm run build

      - name: Install documentation dependencies
        run: npm ci

      - name: Install API generator dependencies
        run: npm run api:ci

      - name: Generate API documentation
        run: npm run api:generate

      - name: Build documentation
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
